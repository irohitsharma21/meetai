# Render blueprint for the MeetAI backend.
#
# Deploy: push this repository to GitHub, then in the Render dashboard choose
# New > Blueprint and point it at the repo. The frontend is NOT here - it goes
# to Vercel, which is better at static React and costs nothing.
#
# Everything marked `sync: false` must be filled in from the Render dashboard.
# Keys are never committed to this file.
services:
  - type: web
    name: meetai-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend

    healthCheckPath: /health

    envVars:
      - key: PORT
        value: 8010

      # One worker. Each is a separate process holding its own embedding model
      # and Qdrant client - about 280 MB measured - so the free instance fits
      # exactly one. More workers means the container is killed mid-request.
      - key: WEB_CONCURRENCY
        value: 1

      - key: ENVIRONMENT
        value: production

      # ── Persistence ──────────────────────────────────────────────────────
      # Render's free filesystem is ephemeral: it is wiped on every deploy and
      # every wake from sleep. SQLite would work and then quietly lose every
      # meeting, which is worse than not working. Point this at a MongoDB Atlas
      # free cluster (512 MB, no card) and the same code uses it unchanged.
      - key: DATABASE_BACKEND
        value: mongodb
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DB_NAME
        value: meetai

      # ── Auth ─────────────────────────────────────────────────────────────
      # Generated by Render on first deploy. Rotating it invalidates every
      # issued token, which is the intended behaviour for a secret.
      - key: SECRET_KEY
        generateValue: true

      # ── CORS ─────────────────────────────────────────────────────────────
      # Set this to the Vercel URL once the frontend is deployed, as a JSON
      # array, e.g. ["https://meetai.vercel.app"]. Leaving it wrong produces a
      # browser CORS error that looks nothing like the misconfiguration it is.
      - key: ALLOWED_ORIGINS
        sync: false

      # ── Providers ────────────────────────────────────────────────────────
      # All optional. Without them the app still runs and says which feature is
      # off and why, rather than failing opaquely.
      - key: STT_PROVIDER
        value: deepgram
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_URL
        sync: false

      # Semantic search downloads a ~50 MB ONNX model on first use and holds it
      # in memory. It fits, but it is the first thing to turn off if the
      # instance starts getting OOM-killed.
      - key: SEMANTIC_SEARCH_ENABLED
        value: true

    autoDeploy: true
